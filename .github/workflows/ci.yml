# Build and test on every push and pull request to main; on a pushed tag vX.Y.Z, also publish a GitHub Release from the same job
# (no artifact passes between jobs, so the account's artifact storage quota never blocks a release).
# The build is tools/ci/build.ps1 (the same script runs locally). Actions are pinned by commit.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write  # only the release step (v* tags) uses it; pull requests from forks get a read-only token regardless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Vulkan SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\VulkanSDK\1.4.363.0
          key: vulkansdk-1.4.363.0-windows-x64  # the version pinned in tools/ci/build.ps1

      - name: Cache NRI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: third_party/NRI
          key: nri-${{ runner.os }}-${{ hashFiles('tools/build_nri.ps1') }}

      - name: Build, test, package
        shell: powershell
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          $a = @{ InstallVulkanSdk = $true }
          if ($env:TAG) { $a.Tag = $env:TAG }  # fails unless the tag is v<the CMakeLists.txt version>
          & .\tools\ci\build.ps1 @a

      # Ordinary builds: the packages for a day, for looking at; a full storage quota does not fail the build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        with:
          name: NFRUX-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content dist\version.txt -Raw).Trim()
          if ($env:TAG -ne "v$v") { throw "tag $env:TAG does not match the built version $v" }
          & .\tools\ci\release_notes.ps1 -Version $v -Out notes.md
          gh release create $env:TAG "dist\NFRUX_$v.zip" "dist\NFRUX_bench_kit_$v.zip" dist\SHA256SUMS.txt --title "NFRUX $v" --notes-file notes.md --verify-tag
          if ($LASTEXITCODE) { throw "gh release create failed (exit $LASTEXITCODE)" }
