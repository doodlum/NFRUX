; NFRUX options. Keep this file beside the NFRUX DLL. Read when the game starts; delete a line to get the default.

[General]
; Highest frame multiplier offered to the game: 2 to 6
MaxMultiplier=6
; 1: write nfrux.log beside the DLL (attach it to bug reports)
Log=0

; Troubleshooting only: auto picks the fastest way that works on this GPU.
[D3D12]
; auto, cuda (NVIDIA RTX), dot4, scalar (slowest, any GPU)
Network=auto

[Vulkan]
; auto, cuda (NVIDIA RTX), coopmat (NVIDIA RTX, AMD RX 7000+, Intel Arc), dot4, scalar (slowest, any GPU)
Network=auto
; 1: stricter GPU synchronisation, a little slower. Try it if you see flicker or corruption
FullBarriers=0
