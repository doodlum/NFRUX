; NFRUX options. Keep this file beside the NFRUX DLL, whatever the DLL is called there. Read once, when the game starts.
; auto (or a deleted line) is NFRUX's own choice. Something this GPU cannot do falls back to auto, and the log says so.
; With Log=1, nfrux.log says "network ...: <what runs>".

[General]
; The highest multiplier offered to the game: auto (6), 2, 3, 4, 5 or 6
MaxMultiplier=auto
; 1: use CUDA and unconfirmed Vulkan features even if the last starts with them crashed
IgnoreCrashMarkers=auto
; 1: nfrux.log beside the DLL. Or a full path to a file
Log=auto
; Which network makes the frames: auto (nfru), nfru (NFRUX's own) or amd (AMD FSR Frame Generation 4's, larger and slower)
Model=auto
; amd only: a weights file made by tools/mlfg_weights.py --bin from a retrained network of the same shape (full path). auto: the built-in ones
AmdWeights=auto
; amd only. Its precision: auto, fp16 (AMD's network as AMD runs it) or int8 (an int8 version: faster on GPUs without
; matrix units, such as the Steam Deck, RX 6000, GTX, Intel iGPUs; slightly different frames). auto: int8 where the fp16
; network would only have the generic kernels, else fp16. int8 runs on CUDA int8 tensor cores (RTX 30 and newer) or
; on integer dot products / 32-bit integers (any GPU)
AmdPrecision=auto
; amd int8 only: a weights file made by tools/mlfg_weights.py --int8 from an int8 export of the same shape (full path)
AmdWeightsInt8=auto

[D3D12]
; How the network runs: auto (the fastest that works), or
;   cuda     NVIDIA RTX 20 and newer
;   dot4     shader model 6.4
;   scalar   any GPU, the slowest
Network=auto
; Model=amd, fp16 (set, it keeps AmdPrecision=auto at fp16). How its network runs: auto, or
;   cuda     NVIDIA RTX 20 and newer (fp16 tensor cores)
;   generic  any GPU, the slowest
AmdNetwork=auto

[Vulkan]
; How the network runs: auto, or
;   cuda           NVIDIA RTX 20 and newer
;   coopmat        cooperative matrices, best type (NVIDIA RTX, AMD RX 7000 and newer, Intel Arc)
;   coopmat_int8, coopmat_fp16, coopmat_bf16   one type
;   dot4           integer dot products
;   scalar         any GPU, the slowest
Network=auto
; 1: use what the GPU can do even if the game did not turn it on, where that is not known (OptiScaler). auto: NVIDIA only
AssumeFeatures=auto
; dot4 only. 1 / 0: the tiled kernels on / off
Dot4Tiled=auto
; dot4 only, tiled: the subgroup size, such as 32 or 64
Dot4Subgroup=auto
; Model=amd, fp16 (set, it keeps AmdPrecision=auto at fp16). How its network runs: auto, or
;   coopmat  fp16 cooperative matrices (NVIDIA RTX, AMD RX 7000 and newer, Intel Arc)
;   generic  any GPU, the slowest
AmdNetwork=auto
; 1: stricter synchronisation, slower. Try it for flicker or corruption
FullBarriers=auto
